# wandb sweep: Saluki 13-species hyperparameter tuning.
#
# Tunes three `train`-section params under optimizer_mode="AdamW+parameter_groups":
#   learning_rate, batch_size (<= 1024), weight_decay (the AdamW decay rate).
# Objective: maximize combined/valid_r (human+mouse validation Pearson, logged
# every epoch by SalukiTrainer).
#
# Create with:
#   wandb sweep --project saluki_sweep --entity project-half-life sweep_saluki_13sp.yaml
# then launch agents with run_sweep_agent.sh (see README).

program: sweep_train.py
method: bayes

metric:
  name: "combined/valid_r"
  goal: maximize

parameters:
  learning_rate:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 3.0e-3
  # weight_decay:
  #   distribution: log_uniform_values
  #   min: 1.0e-6
  #   max: 1.0e-1
  # batch_size >= 64 keeps the slowest trial inside the 8h SLURM wall
  # (~100 s/epoch at bs=64 on 13 species); <= 1024 respects the memory limit
  # (probe: 1024 fits, 2048 OOMs).
  batch_size:
    values: [64, 128, 256, 512, 1024]

# Hyperband kills bottom-of-bracket trials early. min_iter/max_iter count epochs
# (SalukiTrainer logs combined/valid_r with step=epoch); brackets ~ 15 / 45 / 135.
early_terminate:
  type: hyperband
  min_iter: 20
  eta: 2

# Optional hard trial budget: uncomment to auto-complete the sweep after N trials.
# Without it, a Bayesian sweep runs until you stop it in the UI/CLI.
# run_cap: 40
